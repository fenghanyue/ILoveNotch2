name: Release compact player DMG

on:
  push:
    branches: [release/compact-player]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up the Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec project-compact-player.yml --quiet

      - name: Test compact playback
        run: swift test --no-parallel --filter 'MediaFeatureTests|NotchReducerTests|NotchMetricsTests|FeatureHostTests'

      - name: Build and verify the universal app
        run: |
          xcodebuild -project OpenNotch.xcodeproj -scheme OpenNotch -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO OPENNOTCH_SOURCE= \
            OPENNOTCH_COMMIT="${GITHUB_SHA:0:7}+player" -quiet build
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/ILoveNotch.app"
          lipo "$app/Contents/MacOS/ILoveNotch" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"

      - name: Package the disk image
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/ILoveNotch.app"
          image="$RUNNER_TEMP/dmg-contents"
          mkdir -p "$image" dist
          ditto "$app" "$image/ILoveNotch.app"
          ln -s /Applications "$image/Applications"
          cd dist
          hdiutil create -volname "ILoveNotch Player" -srcfolder "$image" \
            -fs HFS+ -format UDZO ILoveNotch-Compact-Player.dmg
          hdiutil verify ILoveNotch-Compact-Player.dmg
          shasum -a 256 ILoveNotch-Compact-Player.dmg > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: compact-player-dmg
          path: dist/
          if-no-files-found: error
          overwrite: true

  startup:
    needs: build
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compact-player-dmg
          path: dist
      - name: Install and launch the packaged app
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS
          mount="$RUNNER_TEMP/mounted-dmg"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" ILoveNotch-Compact-Player.dmg
          app="$RUNNER_TEMP/Installed/ILoveNotch.app"
          mkdir -p "$(dirname "$app")"
          ditto "$mount/ILoveNotch.app" "$app"
          hdiutil detach "$mount"
          codesign --verify --deep --strict "$app"
          binary="$app/Contents/MacOS/ILoveNotch"
          # Sonoma refuses to load a third-party framework with a different Team ID at launch.
          dependencies="$(otool -arch all -L "$binary")"
          if [[ "$dependencies" == *Sparkle.framework* || -e "$app/Contents/Frameworks/Sparkle.framework" ]]; then
            echo 'The ad-hoc player must not embed or link Sparkle.'
            exit 1
          fi
          open -g "$app"
          sleep 5
          pid="$(pgrep -x ILoveNotch)"
          open -g -a "$app" 'ilovenotch://show?title=Startup%20test'
          sleep 3
          kill -0 "$pid"

  publish:
    needs: startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compact-player-dmg
          path: dist

      - name: Publish the GitHub prerelease
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.0.0-player.${{ github.run_number }}
        run: |
          sha256sum --check SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          收起刘海时，左侧显示专辑封面，右侧显示播放音柱。鼠标移到音柱上可暂停，暂停后播放键常驻。自然切歌仍显示原有的曲名提示。

          修复了 macOS 14.6.1 上因 Sparkle 与主应用签名团队不同导致的启动闪退。此定制版的更新入口打开本仓库的 Releases 页面。

          适用于 macOS 14.6 或更高版本，支持 Apple 芯片和 Intel Mac。下载 **ILoveNotch-Compact-Player.dmg**，退出正在运行的 ILoveNotch，打开 DMG 并将应用拖到 Applications 替换原版。

          这是此仓库的定制预发布版，采用本地签名（ad hoc）。此构建未经 Apple 公证，macOS 首次打开时可能提示无法验证开发者。
          NOTES
          gh release create "$RELEASE_TAG" ILoveNotch-Compact-Player.dmg SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "ILoveNotch 2.0.0 · 刘海两侧播放器" --notes-file "$RUNNER_TEMP/release-notes.md"
